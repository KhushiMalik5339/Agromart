<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_7 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_7" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_7');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 500;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
directionalLight.position.set(5, 10, 7.5);
scene.add(directionalLight);

// Group to hold the "plant"
const plant = new THREE.Group();
scene.add(plant);

// Material
const stemMaterial = new THREE.MeshPhongMaterial({ color: 0x2E7D32 });
const leafMaterial = new THREE.MeshPhongMaterial({ color: 0x81C784, side: THREE.DoubleSide });

// Create a simple procedural plant
function createPlant() {
    // Stem
    const stemGeometry = new THREE.CylinderGeometry(0.1, 0.2, 5, 8);
    const stem = new THREE.Mesh(stemGeometry, stemMaterial);
    stem.position.y = 2.5;
    plant.add(stem);

    // Leaves
    for (let i = 0; i < 8; i++) {
        const leafGroup = new THREE.Group();
        
        const leafGeometry = new THREE.SphereGeometry(0.5, 8, 8);
        leafGeometry.scale(1, 0.1, 1.5);
        const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
        
        leaf.position.z = 0.75;
        leafGroup.add(leaf);
        
        leafGroup.position.y = 1 + i * 0.5;
        leafGroup.rotation.y = (i * Math.PI) / 2 + (Math.random() * 0.5);
        leafGroup.rotation.x = Math.PI / 4;
        
        plant.add(leafGroup);
    }
}

createPlant();

camera.position.z = 8;
camera.position.y = 3;
camera.lookAt(0, 2.5, 0);

// Animation
function animate() {
    requestAnimationFrame(animate);
    
    // Gentle sway
    plant.rotation.y += 0.005;
    plant.rotation.z = Math.sin(Date.now() * 0.001) * 0.05;
    
    renderer.render(scene, camera);
}

animate();

// Resize listener
window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || 500;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_7 -->
</body>
</html>
